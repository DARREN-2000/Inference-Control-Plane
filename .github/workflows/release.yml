name: Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="v${INPUT_VERSION}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          export VERSION
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]

          init_text = Path("src/inference_control_plane/__init__.py").read_text()
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text)
          if not match:
            print("Unable to find __version__ in src/inference_control_plane/__init__.py")
            sys.exit(1)
          if match.group(1) != version:
            print(f"Backend version {match.group(1)} does not match tag {version}")
            sys.exit(1)

          package = json.loads(Path("frontend/package.json").read_text())
          if package.get("version") != version:
            print(
                f"Frontend version {package.get('version')} does not match tag {version}"
            )
            sys.exit(1)
          PY

  python:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload Python artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Publish to PyPI (optional)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@darren-2000"
      - name: Build frontend package
        run: |
          npm install
          npm test
          npm run build
      - name: Pack frontend
        run: npm pack
      - name: Upload frontend package to release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/*.tgz
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/inference-control-plane-api
            ghcr.io/${{ github.repository_owner }}/inference-control-plane-worker
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
