[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-control-plane"
dynamic = ["version"]
description = "Real-time LLM traffic control gateway with routing, caching, rate limits, and observability."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "DARREN"}]
keywords = [
	"fastapi",
	"llm",
	"gateway",
	"observability",
	"routing",
	"rate-limiting",
	"cache",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Framework :: FastAPI",
	"Topic :: Internet :: WWW/HTTP",
	"Topic :: System :: Monitoring",
]
dependencies = [
	"fastapi>=0.115.0,<1.0.0",
	"uvicorn[standard]>=0.30.0,<1.0.0",
	"sqlalchemy[asyncio]>=2.0.30,<3.0.0",
	"alembic>=1.13.0,<2.0.0",
	"asyncpg>=0.29.0,<1.0.0",
	"redis>=5.0.0,<6.0.0",
	"pydantic>=2.8.0,<3.0.0",
	"pydantic-settings>=2.14.2",
	"httpx>=0.27.0,<1.0.0",
	"tenacity>=8.3.0,<9.0.0",
	"prometheus-client>=0.20.0,<1.0.0",
	"opentelemetry-api>=1.26.0,<2.0.0",
	"opentelemetry-sdk>=1.26.0,<2.0.0",
	"opentelemetry-exporter-otlp>=1.26.0,<2.0.0",
	"opentelemetry-instrumentation-fastapi>=0.47b0,<1.0.0",
	"opentelemetry-instrumentation-httpx>=0.47b0,<1.0.0",
	"opentelemetry-instrumentation-redis>=0.47b0,<1.0.0",
	"opentelemetry-instrumentation-sqlalchemy>=0.47b0,<1.0.0",
	"starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.2.0,<9.0.0",
	"aiosqlite>=0.20.0,<1.0.0",
	"ruff>=0.11.0,<1.0.0",
	"mypy>=1.10.0,<2.0.0",
	"pre-commit>=3.7.0,<4.0.0",
	"pytest-cov>=4.0.0",
	"build>=1.2.1,<2.0.0",
	"twine>=5.1.0,<6.0.0",
]

[project.scripts]
inference-control-plane = "inference_control_plane.cli:main"

[project.urls]
Homepage = "https://github.com/DARREN-2000/Inference-Control-Plane"
Repository = "https://github.com/DARREN-2000/Inference-Control-Plane"
Documentation = "https://github.com/DARREN-2000/Inference-Control-Plane/blob/main/README.md"
Issues = "https://github.com/DARREN-2000/Inference-Control-Plane/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["inference_control_plane*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "inference_control_plane.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["inference_control_plane"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
