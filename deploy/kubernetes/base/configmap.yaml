apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-control-plane-config
  namespace: inference-control-plane
data:
  APP_NAME: Inference Control Plane
  SERVICE_NAME: inference-control-plane
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  HOST: 0.0.0.0
  PORT: "8000"
  CORS_ALLOWED_ORIGINS: '["https://console.example.com"]'
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/inference_cp
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: "300"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  DEFAULT_RATE_LIMIT_PER_MINUTE: "120"
  USER_RATE_LIMIT_PER_MINUTE: "60"
  CHEAP_MODEL_NAME: cheap-model
  PREMIUM_MODEL_NAME: premium-model
  ROUTER_TOKEN_THRESHOLD: "1200"
  CHEAP_MODEL_COST_PER_1K_TOKENS: "0.0008"
  PREMIUM_MODEL_COST_PER_1K_TOKENS: "0.01"
  LLM_MODE: simulated
  LLM_BASE_URL: https://api.openai.com
  LLM_TIMEOUT_SECONDS: "20"
  LLM_MAX_RETRIES: "2"
  AUTH_CACHE_TTL_SECONDS: "600"
  PROMETHEUS_NAMESPACE: inference_control_plane
