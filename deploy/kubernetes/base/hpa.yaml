apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-control-plane-hpa
  namespace: inference-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-control-plane
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
