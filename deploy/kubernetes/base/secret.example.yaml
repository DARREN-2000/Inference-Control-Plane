apiVersion: v1
kind: Secret
metadata:
  name: inference-control-plane-secrets
  namespace: inference-control-plane
type: Opaque
stringData:
  DEFAULT_API_KEY: replace-with-strong-api-key
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@inference-control-plane-postgres:5432/inference_cp
  POSTGRES_PASSWORD: postgres
  LLM_API_KEY: optional-if-openai-compatible
  OTLP_ENDPOINT: optional-otlp-endpoint
