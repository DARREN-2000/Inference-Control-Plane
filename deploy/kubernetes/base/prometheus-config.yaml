apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: inference-control-plane
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "inference-control-plane"
        metrics_path: /metrics
        static_configs:
          - targets: ["inference-control-plane:80"]
