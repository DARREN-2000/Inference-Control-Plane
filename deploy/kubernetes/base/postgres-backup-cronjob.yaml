apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: inference-control-plane
spec:
  schedule: "0 2 * * *" # Run at 2 AM every day
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-dump
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - "export PG_URL=$(echo $DATABASE_URL | sed 's/+asyncpg//'); pg_dump -d $PG_URL -F c -f /backup/db-backup-$(date +%F).dump"
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inference-control-plane-secrets
                  key: DATABASE_URL
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
