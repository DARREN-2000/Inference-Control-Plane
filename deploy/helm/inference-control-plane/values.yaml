replicaCount: 2

image:
  repository: ghcr.io/darren-2000/inference-control-plane
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

config:
  appName: "Inference Control Plane"
  environment: "production"
  logLevel: "INFO"
  databaseUrl: "postgresql+asyncpg://postgres:postgres@postgres:5432/inference_cp"
  redisUrl: "redis://redis:6379/0"
  llmMode: "simulated"

secret:
  defaultApiKey: "dev-inference-key"
