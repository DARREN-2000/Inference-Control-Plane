apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-config
  labels:
    app: {{ include "inference-control-plane.name" . }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  LLM_MODE: {{ .Values.config.llmMode | quote }}
