apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-control-plane.fullname" . }}
  labels:
    app: {{ include "inference-control-plane.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "inference-control-plane.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "inference-control-plane.name" . }}
    spec:
      initContainers:
        - name: db-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "inference-control-plane.fullname" . }}-config
            - secretRef:
                name: {{ include "inference-control-plane.fullname" . }}-secrets
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "inference_control_plane.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "inference-control-plane.fullname" . }}-config
            - secretRef:
                name: {{ include "inference-control-plane.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
