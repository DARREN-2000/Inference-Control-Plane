apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-secrets
  labels:
    app: {{ include "inference-control-plane.name" . }}
type: Opaque
stringData:
  DEFAULT_API_KEY: {{ .Values.secret.defaultApiKey | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
