apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-postgres-backup
  labels:
    app: {{ include "inference-control-plane.name" . }}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-dump
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - "export PG_URL=$(echo $DATABASE_URL | sed 's/+asyncpg//'); pg_dump -d $PG_URL -F c -f /backup/db-backup-$(date +%F).dump"
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inference-control-plane.fullname" . }}-secrets
                  key: DATABASE_URL
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: {{ include "inference-control-plane.fullname" . }}-postgres-backup-pvc
