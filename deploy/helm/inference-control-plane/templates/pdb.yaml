{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inference-control-plane.fullname" . }}
  labels:
    app: {{ include "inference-control-plane.name" . }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "inference-control-plane.name" . }}
{{- end }}
