version: "1"

services:
  # ---------------------------------------------------------
  # Redis Cache & Rate Limiting
  # ---------------------------------------------------------
  - type: redis
    name: inference-redis
    plan: free
    ipAllowList: [] # Allow internal Render connections only by default
    maxmemoryPolicy: allkeys-lru

  # ---------------------------------------------------------
  # FastAPI Backend API Gateway
  # ---------------------------------------------------------
  - type: web
    name: inference-api
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "./scripts/start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inference-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: inference-redis
          property: connectionString
      - key: DEFAULT_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Inference Control Plane"

  # ---------------------------------------------------------
  # Next.js Dashboard
  # ---------------------------------------------------------
  - type: web
    name: inference-dashboard
    plan: free
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: inference-api
          property: host

  # ---------------------------------------------------------
  # Marketing & Documentation Website (Static)
  # ---------------------------------------------------------
  - type: web
    name: inference-website
    env: static
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  # ---------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------
  - name: inference-db
    plan: free
    databaseName: inference_cp
    user: inference_user
