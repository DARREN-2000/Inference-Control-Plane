<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-label="Telemetry strip showing routing, cache, limits, logs, and metrics.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1120" flood-opacity="0.6"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 14 10; animation: dash 3.2s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.35); opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="260" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="260" rx="32" fill="url(#grid)" opacity="0.35"/>

  <g font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">
    <g transform="translate(95 60)" filter="url(#shadow)">
      <rect width="250" height="140" rx="20" fill="#0F172A" stroke="#1F2937"/>
      <text x="125" y="34">Routing</text>
      <line class="flow" x1="40" y1="86" x2="210" y2="86" stroke="url(#flow)" stroke-width="3"/>
      <circle class="pulse" cx="52" cy="86" r="6" fill="#38BDF8"/>
      <circle class="pulse" cx="125" cy="86" r="5" fill="#22C55E" style="animation-delay:0.4s"/>
      <circle class="pulse" cx="198" cy="86" r="6" fill="#A78BFA" style="animation-delay:0.8s"/>
      <text x="125" y="116" font-size="12" fill="#94A3B8">priority and token thresholds</text>
    </g>

    <g transform="translate(365 60)" filter="url(#shadow)">
      <rect width="250" height="140" rx="20" fill="#0F172A" stroke="#1F2937"/>
      <text x="125" y="34">Cache</text>
      <rect x="80" y="64" width="90" height="50" rx="8" fill="#111827" stroke="#334155"/>
      <ellipse cx="125" cy="64" rx="45" ry="12" fill="#1F2937"/>
      <ellipse cx="125" cy="114" rx="45" ry="12" fill="#1F2937"/>
      <circle class="pulse" cx="188" cy="86" r="6" fill="#22C55E"/>
      <text x="125" y="126" font-size="12" fill="#94A3B8">redis response store</text>
    </g>

    <g transform="translate(635 60)" filter="url(#shadow)">
      <rect width="250" height="140" rx="20" fill="#0F172A" stroke="#1F2937"/>
      <text x="125" y="34">Limits</text>
      <path d="M70 110 A55 55 0 0 1 180 110" fill="none" stroke="#FBBF24" stroke-width="8"/>
      <line class="flow" x1="125" y1="110" x2="155" y2="80" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <circle class="pulse" cx="125" cy="110" r="6" fill="#F97316"/>
      <text x="125" y="126" font-size="12" fill="#94A3B8">per-key and per-user</text>
    </g>

    <g transform="translate(905 60)" filter="url(#shadow)">
      <rect width="250" height="140" rx="20" fill="#0F172A" stroke="#1F2937"/>
      <text x="125" y="34">Logs</text>
      <rect x="60" y="66" width="130" height="12" rx="6" fill="#1F2937"/>
      <rect x="60" y="86" width="110" height="12" rx="6" fill="#334155"/>
      <rect x="60" y="106" width="140" height="12" rx="6" fill="#1F2937"/>
      <circle class="pulse" cx="200" cy="72" r="5" fill="#38BDF8"/>
      <text x="125" y="126" font-size="12" fill="#94A3B8">per-request audit trail</text>
    </g>

    <g transform="translate(1175 60)" filter="url(#shadow)">
      <rect width="250" height="140" rx="20" fill="#0F172A" stroke="#1F2937"/>
      <text x="125" y="34">Metrics</text>
      <rect x="70" y="92" width="18" height="30" rx="6" fill="#A5B4FC"/>
      <rect x="98" y="78" width="18" height="44" rx="6" fill="#60A5FA"/>
      <rect x="126" y="68" width="18" height="54" rx="6" fill="#34D399"/>
      <rect x="154" y="84" width="18" height="38" rx="6" fill="#FB7185"/>
      <circle class="pulse" cx="164" cy="62" r="6" fill="#C084FC"/>
      <text x="125" y="126" font-size="12" fill="#94A3B8">prometheus and otel</text>
    </g>
  </g>
</svg>
