<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Request routing flow: incoming request with priority signal, routing policy evaluation, model selection with 70/20/10 distribution, and response caching.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FB6A76"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#334155" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 18 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.35); opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)" opacity="0.2"/>
  <g stroke="url(#flow)" stroke-width="4" fill="none" opacity="0.9">
    <path class="flow" d="M340 260 L420 260"/>
    <path class="flow" d="M580 260 L660 260"/>
    <path class="flow" d="M820 180 L900 140"/>
    <path class="flow" d="M820 260 L900 260"/>
    <path class="flow" d="M820 340 L900 380"/>
    <path class="flow" d="M1060 140 L1140 160"/>
    <path class="flow" d="M1060 260 L1140 260"/>
    <path class="flow" d="M1060 380 L1140 340"/>
  </g>
  <g>
    <circle class="pulse" cx="320" cy="260" r="16" fill="#38BDF8"/>
    <circle class="pulse" cx="1220" cy="260" r="16" fill="#6EE7B7" style="animation-delay:0.6s"/>
  </g>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#F1F5F9">Request Routing Flow</text>
  <rect x="150" y="200" width="190" height="120" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="245" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Request</text>
  <text x="245" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Priority)</text>
  <rect x="420" y="200" width="160" height="120" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Policy</text>
  <text x="500" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Rules)</text>
  <rect x="660" y="200" width="160" height="120" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="740" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Router</text>
  <text x="740" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Decisions)</text>
  <g font-family="Arial, sans-serif">
    <rect x="900" y="80" width="160" height="100" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
    <text x="980" y="115" font-size="14" text-anchor="middle" fill="#E2E8F0">Model A</text>
    <text x="980" y="140" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">70%</text>
    <rect x="900" y="210" width="160" height="100" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
    <text x="980" y="245" font-size="14" text-anchor="middle" fill="#E2E8F0">Model B</text>
    <text x="980" y="270" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">20%</text>
    <rect x="900" y="340" width="160" height="100" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
    <text x="980" y="375" font-size="14" text-anchor="middle" fill="#E2E8F0">Model C</text>
    <text x="980" y="400" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">10%</text>
  </g>
  <rect x="1140" y="110" width="180" height="80" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="1230" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Response A</text>
  <text x="1230" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Cached)</text>
  <rect x="1140" y="220" width="180" height="80" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="1230" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Response B</text>
  <text x="1230" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Cached)</text>
  <rect x="1140" y="330" width="180" height="80" rx="16" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="1230" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E2E8F0">Response C</text>
  <text x="1230" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94A3B8">(Cached)</text>
  <text x="800" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#94A3B8">Requests are evaluated against routing policies, distributed to models by percentage weight, and responses are cached.</text>
</svg>