<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="System overview: incoming requests → Inference Control Plane (auth, routing, cache, rate limits, logging, metrics) → models, backed by Redis, PostgreSQL, and Prometheus.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#E9F2FB"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FB6A76"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94A3B8" flood-opacity="0.35"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 18 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.35); opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)" opacity="0.2"/>
  <g stroke="url(#flow)" stroke-width="4" fill="none" opacity="0.9">
    <path class="flow" d="M260 190 C 340 140, 400 150, 480 190"/>
    <path class="flow" d="M260 260 C 340 260, 400 260, 480 260"/>
    <path class="flow" d="M260 330 C 340 380, 400 370, 480 330"/>
    <path class="flow" d="M1120 190 C 1200 150, 1260 150, 1340 190"/>
    <path class="flow" d="M1120 260 C 1200 260, 1260 260, 1340 260"/>
    <path class="flow" d="M1120 330 C 1200 370, 1260 380, 1340 330"/>
    <path class="flow" d="M720 360 C 690 390, 660 400, 640 420"/>
    <path class="flow" d="M840 360 C 840 390, 840 400, 840 420"/>
    <path class="flow" d="M960 360 C 990 390, 1020 400, 1040 420"/>
  </g>
  <g>
    <circle class="pulse" cx="240" cy="260" r="16" fill="#38BDF8"/>
    <circle class="pulse" cx="1360" cy="260" r="16" fill="#6EE7B7" style="animation-delay:0.6s"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="160" width="160" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="160" y="194" font-size="16" fill="#334155">Apps</text>
    <rect x="80" y="250" width="160" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="160" y="284" font-size="16" fill="#334155">Services</text>
    <rect x="80" y="340" width="160" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="160" y="374" font-size="16" fill="#334155">Agents</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="420" y="120" width="760" height="260" rx="28" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="800" y="170" font-size="26" fill="#0F172A">Inference Control Plane</text>
    <text x="800" y="198" font-size="14" fill="#64748B">Auth, routing, cache, limits, logs, metrics</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">
    <rect x="500" y="210" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="580" y="238">Auth</text>
    <rect x="720" y="210" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="800" y="238">Route</text>
    <rect x="940" y="210" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="1020" y="238">Cache</text>
    <rect x="500" y="270" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="580" y="298">Limits</text>
    <rect x="720" y="270" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="800" y="298">Logs</text>
    <rect x="940" y="270" width="160" height="44" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="1020" y="298">Metrics</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="1280" y="150" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1390" y="184" font-size="16" fill="#334155">Model A</text>
    <rect x="1280" y="230" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1390" y="264" font-size="16" fill="#334155">Model B</text>
    <rect x="1280" y="310" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1390" y="344" font-size="16" fill="#334155">Fallback</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="540" y="420" width="170" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="625" y="452" font-size="15" fill="#334155">PostgreSQL</text>
    <rect x="740" y="420" width="170" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="825" y="452" font-size="15" fill="#334155">Redis</text>
    <rect x="940" y="420" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1050" y="452" font-size="15" fill="#334155">Prometheus</text>
  </g>
</svg><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="System overview for the Inference Control Plane.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#E9F2FB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#FB6A76" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#F7FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FB6A76"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#94A3B8"/>
    </pattern>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94A3B8" flood-opacity="0.35"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 18 12; animation: dash 3s linear infinite; }
      .flow.slow { animation-duration: 4.8s; opacity: 0.7; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .float { animation: float 8s ease-in-out infinite; }
      .scan { animation: scan 10s linear infinite; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.35); opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(-32px); } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="36" fill="url(#glow)"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)" opacity="0.2"/>
  <rect class="scan" width="1600" height="520" rx="36" fill="url(#scan)" opacity="0.08"/>
  <g opacity="0.2">
    <circle class="float" cx="140" cy="90" r="70" fill="#A5B4FC"/>
