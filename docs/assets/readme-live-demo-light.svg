<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="Live demo preview with animated request pulses.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 16 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -78; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.4); opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="360" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="360" rx="36" fill="url(#grid)" opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="120" y="60" width="1360" height="240" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#0F172A">
    <text x="160" y="96" font-size="18">Live Demo</text>
    <text x="160" y="120" font-size="12" fill="#64748B">Simulated traffic pulses and operator responses</text>
  </g>

  <g>
    <rect x="160" y="140" width="360" height="140" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="180" y="168" width="260" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="180" y="190" width="220" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="180" y="212" width="280" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="180" y="234" width="200" height="12" rx="6" fill="#E2E8F0"/>
    <circle class="pulse" cx="472" cy="214" r="7" fill="#0EA5E9"/>
  </g>

  <g>
    <rect x="560" y="140" width="780" height="80" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="590" y="168" width="520" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="590" y="188" width="460" height="10" rx="5" fill="#E2E8F0"/>
    <line class="flow" x1="600" y1="210" x2="1320" y2="210" stroke="url(#flow)" stroke-width="3"/>
  </g>

  <g>
    <rect x="560" y="230" width="380" height="70" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="590" y="254" width="120" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="590" y="272" width="160" height="10" rx="5" fill="#E2E8F0"/>
    <circle class="pulse" cx="900" cy="265" r="6" fill="#22C55E" style="animation-delay:0.4s"/>
  </g>

  <g>
    <rect x="960" y="230" width="380" height="70" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="990" y="254" width="140" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="990" y="272" width="180" height="10" rx="5" fill="#E2E8F0"/>
    <circle class="pulse" cx="1300" cy="265" r="6" fill="#8B5CF6" style="animation-delay:0.8s"/>
  </g>
</svg>
