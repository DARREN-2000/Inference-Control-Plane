<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-label="Developer experience quick start commands.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1600" height="240" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="240" rx="32" fill="url(#grid)" opacity="0.22"/>

  <g font-family="Arial, sans-serif" fill="#0F172A">
    <text x="120" y="52" font-size="18">Get started fast</text>
    <text x="120" y="74" font-size="12" fill="#64748B">Local stack, API server, and a test request</text>
  </g>

  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#0F172A">
    <g transform="translate(140 90)" filter="url(#shadow)">
      <rect width="420" height="110" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="26" cy="26" r="6" fill="#38BDF8"/>
      <circle cx="46" cy="26" r="6" fill="#A5B4FC"/>
      <circle cx="66" cy="26" r="6" fill="#FBBF24"/>
      <text x="24" y="62">docker compose up --build</text>
    </g>

    <g transform="translate(590 90)" filter="url(#shadow)">
      <rect width="420" height="110" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="26" cy="26" r="6" fill="#34D399"/>
      <circle cx="46" cy="26" r="6" fill="#60A5FA"/>
      <circle cx="66" cy="26" r="6" fill="#F97316"/>
      <text x="24" y="62">uvicorn app.main:app --reload</text>
    </g>

    <g transform="translate(1040 90)" filter="url(#shadow)">
      <rect width="420" height="110" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="26" cy="26" r="6" fill="#F472B6"/>
      <circle cx="46" cy="26" r="6" fill="#38BDF8"/>
      <circle cx="66" cy="26" r="6" fill="#A78BFA"/>
      <text x="24" y="62">curl -X POST /api/v1/generate</text>
    </g>
  </g>
</svg>
