<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Request routing flow: incoming request with priority signal, routing policy evaluation, model selection with 70/20/10 distribution, and response caching.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#E9F2FB"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FB6A76"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94A3B8" flood-opacity="0.35"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 18 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.35); opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)" opacity="0.2"/>
  <g stroke="url(#flow)" stroke-width="4" fill="none" opacity="0.9">
    <path class="flow" d="M340 260 L420 260"/>
    <path class="flow" d="M580 260 L660 260"/>
    <path class="flow" d="M820 180 L900 140"/>
    <path class="flow" d="M820 260 L900 260"/>
    <path class="flow" d="M820 340 L900 380"/>
    <path class="flow" d="M1060 140 L1140 160"/>
    <path class="flow" d="M1060 260 L1140 260"/>
    <path class="flow" d="M1060 380 L1140 340"/>
  </g>
  <g>
    <circle class="pulse" cx="320" cy="260" r="16" fill="#38BDF8"/>
    <circle class="pulse" cx="1220" cy="260" r="16" fill="#6EE7B7" style="animation-delay:0.6s"/>
  </g>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A">Request Routing Flow</text>
  <rect x="150" y="200" width="190" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="245" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Request</text>
  <text x="245" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Priority)</text>
  <rect x="420" y="200" width="160" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Policy</text>
  <text x="500" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Rules)</text>
  <rect x="660" y="200" width="160" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="740" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Router</text>
  <text x="740" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Decisions)</text>
  <g font-family="Arial, sans-serif">
    <rect x="900" y="80" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="980" y="115" font-size="14" text-anchor="middle" fill="#334155">Model A</text>
    <text x="980" y="140" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">70%</text>
    <rect x="900" y="210" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="980" y="245" font-size="14" text-anchor="middle" fill="#334155">Model B</text>
    <text x="980" y="270" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">20%</text>
    <rect x="900" y="340" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="980" y="375" font-size="14" text-anchor="middle" fill="#334155">Model C</text>
    <text x="980" y="400" font-size="12" text-anchor="middle" fill="#FB6A76" font-weight="bold">10%</text>
  </g>
  <rect x="1140" y="110" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="1230" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Response A</text>
  <text x="1230" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Cached)</text>
  <rect x="1140" y="220" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="1230" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Response B</text>
  <text x="1230" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Cached)</text>
  <rect x="1140" y="330" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="1230" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Response C</text>
  <text x="1230" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">(Cached)</text>
  <text x="800" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748B">Requests are evaluated against routing policies, distributed to models by percentage weight, and responses are cached.</text>
</svg><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Routing and policy decision flow.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#E9F2FB"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FB6A76"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#94A3B8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94A3B8" flood-opacity="0.35"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 18 12; animation: dash 3s linear infinite; }
      .flow.slow { animation-duration: 4.6s; opacity: 0.7; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .scan { animation: scan 10s linear infinite; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.35); opacity: 1; } }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(-32px); } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)" opacity="0.2"/>
  <rect class="scan" width="1600" height="520" rx="36" fill="url(#scan)" opacity="0.08"/>
  <g stroke="url(#flow)" stroke-width="4" fill="none" opacity="0.9">
    <path class="flow" d="M260 260 C 360 240, 420 240, 520 260"/>
    <path class="flow slow" d="M760 200 C 900 140, 1020 140, 1180 180"/>
    <path class="flow" d="M760 260 C 900 260, 1020 260, 1180 260"/>
    <path class="flow slow" d="M760 320 C 900 380, 1020 380, 1180 340"/>
    <path class="flow" d="M760 290 C 860 340, 940 360, 1080 380"/>
  </g>
  <g>
    <circle class="pulse" cx="240" cy="260" r="16" fill="#38BDF8"/>
    <circle class="pulse" cx="1180" cy="260" r="14" fill="#6EE7B7" style="animation-delay:0.6s"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="200" cy="260" r="48" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="200" y="256" font-size="14" fill="#334155">Request</text>
    <text x="200" y="276" font-size="12" fill="#64748B">priority</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="620" y="90" width="260" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="750" y="124" font-size="16" fill="#334155">Policy</text>
  </g>
  <g>
    <rect x="690" y="210" width="140" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" transform="rotate(45 760 280)" filter="url(#shadow)"/>
    <text x="760" y="272" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#334155">Router</text>
    <text x="760" y="292" font-size="12" font-family="Arial, sans-serif" text-anchor="middle" fill="#64748B">rules</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="1220" y="150" width="260" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="1350" y="184" font-size="16" fill="#334155">Model A</text>
    <text x="1350" y="202" font-size="12" fill="#64748B">70 percent</text>
    <rect x="1220" y="230" width="260" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="1350" y="264" font-size="16" fill="#334155">Model B</text>
    <text x="1350" y="282" font-size="12" fill="#64748B">20 percent</text>
    <rect x="1220" y="310" width="260" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="1350" y="344" font-size="16" fill="#334155">Fallback</text>
    <text x="1350" y="362" font-size="12" fill="#64748B">10 percent</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="620" y="380" width="260" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="750" y="414" font-size="16" fill="#334155">Cache</text>
  </g>
</svg>
